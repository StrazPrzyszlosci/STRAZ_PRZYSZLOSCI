name: Repository Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 tools/agent_claims.py check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.mjs
      - run: for f in cloudflare/src/*.js; do node --check "$f" || exit 1; done
      - run: python3 agentic_cells/validate_cell_manifest.py
      - run: python3 human_approval/validate_record.py
