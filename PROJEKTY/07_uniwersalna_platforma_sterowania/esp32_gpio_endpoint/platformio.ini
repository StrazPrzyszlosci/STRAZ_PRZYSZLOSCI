; PlatformIO project: ESP32 GPIO endpoint for Straż Edge węzły
; Kompatybilne z gpio-usb / gpio-http / gpio-mqtt / gpio-ws ze straz-edge-installer.
;
; Wgraj: pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    knolleary/PubSubClient@^2.8
    links2004/arduinoWebSockets@^2.4
build_flags =
    -DSTRAZ_GPIO_ENDPOINT
